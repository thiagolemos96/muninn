name: Keepalive

# Supabase Free pauses a project after a week without activity.
# A small read through the Data API every 3 days keeps it awake.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one public campaign
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || {
            echo "Set SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions > Variables"
            exit 1
          }
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/campaigns?select=slug&limit=1"
