<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nothing here is for search engines: the Escudo is private and the Grimório is shared by link -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Muninn</title>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Browser chrome color: mirrors --bar in each theme -->
    <meta name="theme-color" content="#F4ECDA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1820" media="(prefers-color-scheme: dark)" />

    <!-- Theme before first paint: saved choice, else system preference.
         Keep the storage key in sync with src/features/theme/theme.ts. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('muninn-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500;1,700&family=Alegreya+Sans:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
